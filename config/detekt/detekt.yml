# Detekt configuration. Merged on top of the bundled defaults
# (buildUponDefaultConfig = true), so only overrides live here.

style:
  MagicNumber:
    # This is a threshold/weights engine: numeric literals are the domain.
    active: false
  MaxLineLength:
    maxLineLength: 140

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated:
      - Composable
  PackageNaming:
    # CLAUDE.md: multi-word packages are snake_case (forgot_password, use_cases, test_flow).
    packagePattern: '[a-z]+(\.[a-z][a-z0-9_]*)*'
